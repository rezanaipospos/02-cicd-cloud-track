# Canary service — selector HANYA app label.
# Sama dengan stable service, selector minimal agar match dengan Rollout pod labels.
apiVersion: v1
kind: Service
metadata:
  name: svc-canary
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: app-port
  selector:
    app: dpl  # akan di-replace oleh namePrefix + patch
