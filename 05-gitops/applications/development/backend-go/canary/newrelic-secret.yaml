# Secret untuk New Relic API credentials
# Digunakan oleh Argo Rollouts AnalysisTemplate untuk query NRQL
#
# PENTING: File ini hanya berisi placeholder — nilai asli di-inject via ESO (External Secrets Operator)
# yang fetch dari Vault path: secret/backend-go/dev
#
# ExternalSecret di bawah akan membuat K8s Secret `newrelic-credentials` yang berisi:
#   - api-key: New Relic User API Key (untuk query NRQL)
#     Buat di: https://one.newrelic.com → API keys → Create key (type: User)
#
# Argo Rollouts membaca credentials dari Secret melalui profile:
#   spec.provider.newRelic.profile: newrelic-credentials
# yang merujuk ke Secret dengan format:
#   data:
#     accountId: <base64>
#     apiKey: <base64>
#
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: newrelic-credentials
  namespace: backend-development
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend     # akan di-replace oleh kustomize replacement
    kind: SecretStore
  target:
    name: newrelic-credentials
    creationPolicy: Owner
  data:
  - secretKey: api-key
    remoteRef:
      key: secret/backend-go/dev
      property: NR_API_KEY
  - secretKey: account-id
    remoteRef:
      key: secret/backend-go/dev
      property: NR_ACCOUNT_ID
