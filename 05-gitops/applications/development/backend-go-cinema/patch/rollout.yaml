apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: rollout
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: app
        image: asia-southeast1-docker.pkg.dev/nsr-devops/docker-images-course/backend-go:5391c80
        ports:
        - name: app-port
          containerPort: 8080
        env:
        - name: APP_BANKING_PRIVATE_KEY_PATH
          value: "/app/keys/banking_private_key.pem"
        envFrom:
        - secretRef:
            name: backend-go-cinema-secrets
            optional: false
        volumeMounts:
        - name: banking-pem
          mountPath: /app/keys
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      # - name: cloud-sql-proxy
      #   # Gunakan Proxy v2
      #   image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0
      #   args:
      #     # Format: PROJECT_ID:REGION:INSTANCE_NAME
      #     - "YOUR_PROJECT_ID:asia-southeast1:course-pg-dev"
      #     - "--port=5432"
      #     - "--private-ip"
      #   securityContext:
      #     runAsNonRoot: true
      #   resources:
      #     requests:
      #       cpu: 10m
      #       memory: 32Mi
      #     limits:
      #       cpu: 100m
      #       memory: 128Mi
      volumes:
      - name: banking-pem
        secret:
          defaultMode: 256
          secretName: backend-go-cinema-pem-secrets
  strategy:
    canary:
      steps:
      - setWeight: 100
