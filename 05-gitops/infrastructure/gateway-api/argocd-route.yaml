# =============================================================================
# HTTPRoute — expose ArgoCD UI via Envoy Gateway
# Domain: argocd.naipospos.cloud
# Backend: argocd-server service di namespace argocd
# =============================================================================

# HTTP → HTTPS redirect
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-http-redirect
  namespace: argocd
spec:
  parentRefs:
    - name: course-gateway
      sectionName: http
      namespace: argocd
  hostnames:
    - "argocd.naipospos.cloud"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
      matches:
        - path:
            type: PathPrefix
            value: /
---
# HTTPS → ArgoCD server
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-https-route
  namespace: argocd
spec:
  parentRefs:
    - name: course-gateway
      sectionName: https
      namespace: argocd
  hostnames:
    - "argocd.naipospos.cloud"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80
      timeouts:
        request: 5m
        backendRequest: 1m
