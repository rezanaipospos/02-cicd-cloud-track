# =============================================================================
# HTTPRoute — expose Vault UI via Envoy Gateway
# Domain: vault.naipospos.cloud
# Backend: vault-ui service di namespace vault
# =============================================================================

# HTTP → HTTPS redirect
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault-http-redirect
  namespace: vault
spec:
  parentRefs:
    - name: course-gateway
      sectionName: http
      namespace: argocd
  hostnames:
    - "vault.naipospos.cloud"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
      matches:
        - path:
            type: PathPrefix
            value: /
---
# HTTPS → vault server
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault-https-route
  namespace: vault
spec:
  parentRefs:
    - name: course-gateway
      sectionName: https
      namespace: argocd
  hostnames:
    - "vault.naipospos.cloud"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: vault-ui
          port: 8200
      timeouts:
        request: 5m
        backendRequest: 1m
