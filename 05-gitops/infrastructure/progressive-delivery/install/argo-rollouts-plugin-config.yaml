# ConfigMap untuk register Gateway API traffic routing plugin di Argo Rollouts.
# File ini di-apply TERPISAH dari kustomize build karena install manifest sudah
# include ConfigMap argo-rollouts-config (tanpa data) yang akan conflict jika
# di-include sebagai resource kustomize.
#
# Apply sekali setelah Argo Rollouts controller running:
#   kubectl apply -f argo-rollouts-plugin-config.yaml
#   kubectl rollout restart deployment argo-rollouts -n argo-rollouts
#
# Plugin akan di-download dari GitHub saat controller restart.
# Pastikan Cloud NAT aktif agar pod bisa reach github.com.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argo-rollouts-config
  namespace: argo-rollouts
data:
  trafficRouterPlugins: |-
    - name: "argoproj-labs/gatewayAPI"
      location: "https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/download/v0.15.0/gatewayapi-plugin-linux-amd64"
