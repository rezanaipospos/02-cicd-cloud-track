apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Argo Rollouts v1.9.0 — manifest di-commit lokal (bukan remote URL).
# Alasan: file lokal lebih aman, reproducible tanpa internet, dan bisa di-patch tanpa breaking.
# Update versi:
#   1. Download versi baru: https://github.com/argoproj/argo-rollouts/releases
#   2. Ganti argo-rollouts-controller-install.yaml
#   3. Commit ke repo

namespace: argo-rollouts

resources:
  - namespace.yaml
  - argo-rollouts-controller-install.yaml

patches:
  - target:
      kind: ConfigMap
      name: argo-rollouts-config
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argo-rollouts-config
      data:
        trafficRouterPlugins: |-
          - name: "argoproj-labs/gatewayAPI"
            location: "https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/download/v0.15.0/gatewayapi-plugin-linux-amd64"

