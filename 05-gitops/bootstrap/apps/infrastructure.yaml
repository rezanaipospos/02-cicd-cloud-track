# Child Application: infrastructure (platform services)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure
  namespace: argocd
spec:
  project: course
  source:
    repoURL: "https://github.com/cinemaxxi-team/devops_architecture.git"  # <- GANTI
    targetRevision: HEAD
    path: course-project/05-gitops/infrastructure
  destination:
    server: "https://kubernetes.default.svc"
    namespace: infrastructure
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
