apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: course
  source:
    repoURL: "https://charts.external-secrets.io"
    chart: external-secrets
    targetRevision: "0.10.5"  # Versi pinned stabil
    helm:
      parameters:
        - name: installCRDs
          value: "true"  # Secara otomatis install CRD ESO
  destination:
    server: "https://kubernetes.default.svc"
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
