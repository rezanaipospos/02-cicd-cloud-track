# Inventory untuk environment dev.
# Koneksi ke VM Jenkins yang tidak punya IP publik — memakai IAP tunnel.
#
# Cara isi:
# 1. Dari output Terragrunt stage 01-infra/environments/dev/compute:
#    - instance_name = ansible_host
#    - instance_zone = dipakai di ProxyCommand
# 2. Ganti <YOUR_PROJECT_ID> dan <YOUR_ZONE> dengan nilai milikmu.
#
# Alternatif (lebih mudah untuk pemula):
#   gcloud compute ssh vm-jenkins-dev --tunnel-through-iap --zone asia-southeast1-a -- -L 2222:localhost:22
#   Lalu set ansible_host: 127.0.0.1, ansible_port: 2222, hapus ansible_ssh_common_args.

all:
  children:
    jenkins:
      hosts:
        vm-jenkins-dev:
          ansible_host: vm-jenkins-dev
          ansible_user: "{{ lookup('env', 'USER') }}"
          ansible_ssh_common_args: >-
            -o ProxyCommand="gcloud compute start-iap-tunnel %h %p
            --listen-on-stdin
            --project=nsr-devops
            --zone=asia-southeast1-a"
